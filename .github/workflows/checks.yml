name: Checks

# Runs the test suite and the linter on the way in, so breakage is visible
# before anything is tagged. The release workflows run the same two commands
# as a gate of their own, so a tag can never build an image from a red tree.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The personal-tools persistence test uses a real disposable SQLite database.
      - name: Generate test database client
        run: bunx --no-install prisma generate --schema prisma/schema.sqlite.prisma

      - name: Tests
        run: bun run test

      # Warnings are reported but do not fail the run; errors do.
      - name: Lint
        run: bun run lint
