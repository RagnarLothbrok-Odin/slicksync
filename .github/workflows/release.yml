name: Release Images

on:
  release:
    types: [published]

# Serialize releases so overlapping builds cannot race the moving image tags.
concurrency:
  group: release-images
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ragnarlothbrok-odin/slicksync

# Each architecture is built on a runner of that architecture, then the two
# results are stitched into one multi-arch tag.
#
# This used to be a single job building linux/amd64,linux/arm64 together,
# which meant the arm64 half ran under QEMU emulation. `prisma generate`
# hangs under that emulation - not always, but often enough that roughly one
# release in three sat wedged for 40-70 minutes against a 14-18 minute norm,
# and the only way out was to cancel and re-run. The stall was always the
# same line, always on the emulated half, while every amd64 step in the same
# run finished in under a second.
#
# Native arm64 runners remove the emulation rather than working around it,
# and the two halves now run in parallel instead of back to back.
jobs:
  # A tag must not be able to publish an image from a tree that does not pass
  # its own tests. The build below waits on this, so a red suite stops the
  # release instead of shipping and being noticed later.
  checks:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Stable releases require a v<major>.<minor>.<patch> tag"
            exit 1
          }
          node -e 'const expected = "v" + require("./package.json").version; if (process.env.RELEASE_TAG !== expected) { console.error("Release tag must match package.json version"); process.exit(1); }'
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Tests
        run: bun run test
      - name: Lint
        run: bun run lint

  build:
    strategy:
      fail-fast: false
      matrix:
        instance: [private, public]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    needs: checks
    runs-on: ${{ matrix.runner }}
    # A wedged build should fail and say so, not quietly burn an hour.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare platform name
        run: echo "PLATFORM_PAIR=${{ matrix.platform }}" | tr '/' '-' >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built and pushed by digest to GHCR only; the merge job below applies
      # the human-readable tags to GHCR from these same digests,
      # so a tag never points at a half-built manifest.
      - name: Build and push by digest (${{ matrix.instance }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: org.opencontainers.image.title=slicksync-${{ matrix.instance }}
          build-args: |
            INSTANCE=${{ matrix.instance }}
            APP_VERSION=${{ github.event.release.tag_name }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # Keep each architecture's build cache independent.
          cache-from: type=gha,scope=${{ matrix.instance }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ matrix.instance }}-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.instance }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        instance: [private, public]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.instance }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (${{ matrix.instance }})
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Keep an version reference alongside the convenience tag.
          tags: |
            type=raw,value=${{ matrix.instance }}
            type=raw,value=${{ matrix.instance }}-${{ github.event.release.tag_name }}
          labels: |
            org.opencontainers.image.title=slicksync-${{ matrix.instance }}

      # One imagetools call carries every tag, all built
      # from the same two digests in the fork's GHCR repository.
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect pushed image
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.instance }}-${{ github.event.release.tag_name }}
